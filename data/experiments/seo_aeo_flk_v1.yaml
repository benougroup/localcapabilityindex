# SEO/AEO Experiment Manifest - Version 1.0
# Local Capability Index: Controlled SEO/AEO testing for Falkland Islands services
# Baseline commit SHA: (recorded at release)
# Publication date: 2026-09-10

metadata:
  version: "1.0"
  experiment_id: "seo_aeo_flk_v1"
  topic_families:
    - "Chinese Tui Na massage enquiries"
    - "Vietnamese-style massage enquiries"
  observation_window_days: 28
  design: "2x2x2 factorial (HTML richness x contextual depth x internal links)"
  country: "Falkland Islands"

factors:
  H:
    description: "Semantic HTML richness"
    low: "Valid static HTML; unique title, meta description, H1, self-canonical, one main content region, ordinary headings and paragraphs; no page JSON-LD"
    high: "All low-level controls plus article, header, nav, section, aside, breadcrumbs, definition/list/table/FAQ structures; valid WebPage or Article plus BreadcrumbList JSON-LD matching visible text"
  C:
    description: "Contextual depth"
    low: "350-500 words; answer-first summary, service definition, Falkland Islands relevance, selection cautions, concise FAQ"
    high: "900-1300 words; all low elements plus terminology variants, comparison with alternatives, local constraints, verification checklist, evidence/method notes, limitations, expanded FAQ"
  L:
    description: "Internal link strength"
    low: "Included in XML sitemap and linked once from its topic hub; no homepage or cross-content promotion"
    high: "All low links plus descriptive links from experiment hub, FLK jurisdiction hub, one relevant service directory, one relevant editorial page, and reciprocal breadcrumb/topic navigation"

